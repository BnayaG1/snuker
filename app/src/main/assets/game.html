<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>Snuker</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage {
      position: absolute;
      inset: 0;
      background: transparent;
    }
    #idleLayer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    #idleBall {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="idleLayer" aria-label="Start pool">
      <canvas id="idleBall" width="192" height="192"></canvas>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var MODE_IDLE = "idle";
      var MODE_GAME = "game";
      var IDLE_SIZE = 96;

      var idleLayer = document.getElementById("idleLayer");
      var idleCanvas = document.getElementById("idleBall");
      var idleCtx = idleCanvas.getContext("2d");
      var pulse = 0;
      var idleRaf = 0;
      var armed = true;

      function nativeBridge() {
        return window.SnukerBridge || null;
      }

      function notifyNativeMode(mode) {
        var b = nativeBridge();
        if (b && typeof b.setMode === "function") b.setMode(mode);
      }

      var SnukerApp = {
        mode: MODE_IDLE,
        setMode: function (mode) {
          if (mode !== MODE_IDLE && mode !== MODE_GAME) return;
          this.mode = mode;
          notifyNativeMode(mode);
          if (mode === MODE_GAME) {
            // Hand off to Classic Pool Game engine.
            window.location.href = "pool/index.html";
            return;
          }
          startIdleLoop();
        },
        enterGame: function () { this.setMode(MODE_GAME); },
        returnIdle: function () { this.setMode(MODE_IDLE); }
      };
      window.SnukerApp = SnukerApp;

      function resizeIdleCanvas() {
        var size = Math.max(2, Math.floor(Math.min(idleLayer.clientWidth, idleLayer.clientHeight) || IDLE_SIZE));
        var dpr = window.devicePixelRatio || 1;
        idleCanvas.style.width = size + "px";
        idleCanvas.style.height = size + "px";
        idleCanvas.width = Math.floor(size * dpr);
        idleCanvas.height = Math.floor(size * dpr);
        idleCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return size;
      }

      function drawEightBall(ctx, cx, cy, r, sheenPhase) {
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, cy + r * 0.72, r * 0.72, r * 0.18, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0,0,0,0.28)";
        ctx.fill();

        var body = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
        body.addColorStop(0, "#3a3a3a");
        body.addColorStop(0.45, "#141414");
        body.addColorStop(1, "#050505");
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = body;
        ctx.fill();

        var discR = r * 0.38;
        var discY = cy - r * 0.02;
        var disc = ctx.createRadialGradient(cx - discR * 0.2, discY - discR * 0.25, discR * 0.1, cx, discY, discR);
        disc.addColorStop(0, "#fff");
        disc.addColorStop(1, "#d8d8d8");
        ctx.beginPath();
        ctx.arc(cx, discY, discR, 0, Math.PI * 2);
        ctx.fillStyle = disc;
        ctx.fill();

        ctx.fillStyle = "#111";
        ctx.font = "700 " + Math.floor(discR * 1.35) + "px 'Segoe UI', system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("8", cx, discY + discR * 0.05);

        var hx = cx - r * 0.32;
        var hy = cy - r * 0.38;
        var gloss = ctx.createRadialGradient(hx, hy, 0, hx, hy, r * 0.42);
        gloss.addColorStop(0, "rgba(255,255,255,0.55)");
        gloss.addColorStop(0.35, "rgba(255,255,255,0.18)");
        gloss.addColorStop(1, "rgba(255,255,255,0)");
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = gloss;
        ctx.fill();

        var ang = sheenPhase * Math.PI * 2;
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.clip();
        ctx.translate(cx, cy);
        ctx.rotate(ang);
        var sheen = ctx.createLinearGradient(-r, 0, r, 0);
        sheen.addColorStop(0.42, "rgba(255,255,255,0)");
        sheen.addColorStop(0.5, "rgba(255,255,255,0.10)");
        sheen.addColorStop(0.58, "rgba(255,255,255,0)");
        ctx.fillStyle = sheen;
        ctx.fillRect(-r, -r, r * 2, r * 2);
        ctx.restore();
        ctx.restore();
      }

      function paintIdle(scale) {
        var size = resizeIdleCanvas();
        idleCtx.clearRect(0, 0, size, size);
        drawEightBall(idleCtx, size / 2, size / 2, (size / 2) * 0.82 * scale, pulse);
      }

      function idleFrame(ts) {
        pulse = (ts % 3200) / 3200;
        paintIdle(1 + Math.sin(pulse * Math.PI * 2) * 0.025);
        idleRaf = requestAnimationFrame(idleFrame);
      }

      function startIdleLoop() {
        if (idleRaf) cancelAnimationFrame(idleRaf);
        idleRaf = requestAnimationFrame(idleFrame);
      }

      function activateGame(e) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        if (!armed || SnukerApp.mode === MODE_GAME) return;
        armed = false;
        SnukerApp.enterGame();
        setTimeout(function () { armed = true; }, 500);
      }

      idleLayer.addEventListener("pointerup", activateGame, { passive: false });
      idleLayer.addEventListener("click", activateGame, { passive: false });
      window.addEventListener("resize", function () { paintIdle(1); });

      notifyNativeMode(MODE_IDLE);
      startIdleLoop();
    })();
  </script>
</body>
</html>
